# SPDX-License-Identifier: Apache-2.0
#
# The single source of truth for "does this commit pass?", called by both
# branch CI (ci.yml, on push/PR) and the release gate (release.yml, on a tag),
# so a tag runs precisely what a PR runs.
name: gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: vet, lint, test, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          # Must track the Go in go.mod: older releases cannot read go1.27's
          # export data and fail every package with a typecheck error.
          version: v2.14.0
      - name: go test -race
        run: go test -race ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      # Against testdata/mock-dcgmi. Real-hardware validation is tracked in
      # issues and its captures live under testdata/real/.
      - name: e2e (mock dcgmi)
        run: bash scripts/e2e.sh
      - name: fuzz the dmon line parser (30s; committed corpus also runs above)
        run: go test -run '^$' -fuzz 'FuzzParseDmonLine$' -fuzztime 30s .

  build:
    name: build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null .
