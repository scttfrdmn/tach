# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The release gate is the SAME reusable gate branch CI runs. A tag pushed to a
  # commit that does not pass the full gate produces no release assets, because
  # goreleaser depends on this job.
  gate:
    uses: ./.github/workflows/gate.yml

  goreleaser:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # keyless cosign signing + provenance (OIDC)
      attestations: write  # SLSA build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # cosign (keyless signing) and syft (SBOM generation) must be on PATH for
      # the goreleaser `signs` and `sboms` blocks.
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
      # The release body is this tag's CHANGELOG.md section, not git log. This
      # fails the release when the section is missing, so a tag can never ship
      # unannotated — add the `## [x.y.z]` section before tagging.
      - name: release notes from CHANGELOG
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          echo "--- release body for $GITHUB_REF_NAME ---"
          cat "$RUNNER_TEMP/release-notes.md"
      - name: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          version: "v2.18.1"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the version to the tag that triggered this run, not `git
          # describe`: an rc and its stable tag can sit on the same commit, and
          # describe then resolves ambiguously.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      # SLSA build-provenance for every shipped artifact, verifiable with
      # `gh attestation verify`.
      - name: attest build provenance (release artifacts)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/tach_*_linux_*.tar.gz
            dist/tach_linux_*
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
      # Assert the published release carries the CHANGELOG section, not an
      # empty body or goreleaser's git-log changelog. A length check alone
      # cannot tell those apart, so probe for the notes' first line.
      - name: verify the published body IS the CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json body -q .body > /tmp/published-body.md
          n=$(wc -c < /tmp/published-body.md)
          if [ "$n" -lt 200 ]; then
            echo "::error::release $GITHUB_REF_NAME published with an empty or stub body ($n bytes)"
            exit 1
          fi
          probe=$(grep -m1 -E '^[A-Za-z*_`#]' "$RUNNER_TEMP/release-notes.md" | cut -c1-60)
          if [ -z "$probe" ]; then
            echo "::error::could not derive a probe line from the notes file"
            exit 1
          fi
          if ! grep -qF -- "$probe" /tmp/published-body.md; then
            echo "::error::published body does not contain the CHANGELOG notes"
            echo "::error::expected to find: $probe"
            head -40 /tmp/published-body.md
            exit 1
          fi
          echo "release body: $n bytes, and it contains the CHANGELOG section"
